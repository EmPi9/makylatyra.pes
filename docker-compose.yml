services:
  postgres:
    image: postgres:14
    container_name: makulatura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: makulatura
    ports:
      - "5432:5432"
    volumes:
      - makulatura_pgdata:/var/lib/postgresql/data
      - ./dump-postgres-202306091935:/dump/dump-postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d makulatura"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  makulatura_pgdata:
